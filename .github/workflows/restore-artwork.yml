name: Assemble original artwork
on:
  push:
    branches: [codex/universos-upload-20260927]
permissions:
  contents: write
jobs:
  assemble:
    if: github.repository == 'Alixonveloz1-ctrl/Universos-IA'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore and verify exact original bytes
        run: |
          mkdir -p public
          cat transport/*.b64 | base64 --decode > public/universos-hero.png
          echo "854a799df45bb91a32131e3afe27463f4959cf66d956ebc44e4482127669d5d8  public/universos-hero.png" | sha256sum --check
          test "$(git hash-object public/universos-hero.png)" = f11003980dc5f73f82abf08a8c19076fa26debfb
      - name: Save the verified artwork on this temporary branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/universos-hero.png
          git commit -m "Restore original artwork with verified SHA-256"
          git push origin HEAD:refs/heads/codex/universos-upload-20260927
