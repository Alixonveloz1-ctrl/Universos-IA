name: Verify without paid generations
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run lint
      - run: npm run typecheck
      - run: bash -n c v install.sh scripts/setup-gcp.sh scripts/configure-access.sh
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Browser failure details (simulated test data only)
        if: failure()
        run: python3 -c 'from pathlib import Path; [print(p.read_text()) for p in Path("test-results").rglob("error-context.md")]'
